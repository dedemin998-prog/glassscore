/* ===== V6 RESPONSIVE HARDENING ===== */
html,body{max-width:100%;overflow-x:hidden}
.app,.scoreShell,.scoreLayout,.teamCard,.middle,.panel,.courtCard,.refTeam,.adminRow{min-width:0}

  .adminRow{grid-template-columns:minmax(0,1fr);gap:8px;padding:11px;border-radius:15px}

/* Extra-small phones. */
@media (max-width:390px){
  .top{grid-template-columns:1fr;justify-items:center}

  .homeHero h1{text-align:left}
  .cardButtons{grid-template-columns:1fr}
  .point{font-size:clamp(54px,18vw,72px)}
  .point.small{font-size:clamp(40px,12vw,55px)}

  .refPoint{font-size:clamp(50px,17vw,64px)}
}

/* Short phone landscape. Keep controls usable without crushing the center column. */
@media (orientation:landscape) and (max-height:520px) and (max-width:900px){
  .app{padding:6px}
  .top{display:flex;align-items:center;margin-bottom:5px;padding-bottom:5px}

  .teamCard{min-height:calc(100dvh - 58px)}

  .point{font-size:clamp(58px,20vh,82px)}.point.small{font-size:clamp(42px,14vh,58px)}
  .pointLabel{margin-top:5px;font-size:8px}.addPoint{min-height:48px;margin:0 5px 5px;font-size:15px}
  .middle{display:flex;padding:6px;gap:4px;overflow:auto}
  .status{min-height:28px;font-size:9px;padding:4px}.games{border:0;padding:0}.gameNums{font-size:40px;margin-top:0}
  .serverBox{padding:5px}.serverBox small{font-size:7px}.serverBox b{font-size:12px}
  .setHistory{display:none}.clocks{display:grid;grid-template-columns:1fr 1fr}.clock{padding:5px}.clock b{font-size:13px}.clock small{font-size:7px}
  .midBtns button{min-height:34px;font-size:9px;padding:4px}
  .sponsorStrip{display:none}
}

<script>
const qs=new URLSearchParams(location.search);let courtId=qs.get("court");let mode=qs.get("mode")||(courtId?"court":"home");let state=null,allCourts=[],es=null,connected=false,timerInterval=null,lastFinishedMatchId=null,pendingSponsors=[];
let lang=(qs.get("lang")||localStorage.getItem("glassscore-lang")||"tr").toLowerCase()==="en"?"en":"tr";
const $=s=>document.querySelector(s),app=$("#app");
const I18N={tr:{connected:"Canlı bağlı",connecting:"Bağlanıyor",disconnected:"Bağlantı koptu",clubPanel:"Kulüp Paneli",heroEye:"GLASS SCORE • LIVE COURT SYSTEM",heroTitle:"Kortun skoru tek merkezde, her ekranda canlı.",heroText:"Kort tableti, hakem telefonu ve seyirci ekranı aynı maçı gerçek zamanlı paylaşır. GLASS SCORE; skor, servis, maç süresi ve kort yönetimini tek akışta birleştirir.",courts:"Kortlar",courtHint:"Bir kort seç ve kullanım modunu aç.",addCourt:"+ Kort Ekle",modes:"Modlar",courtTablet:"Kort Tableti",referee:"Hakem",tv:"TV Ekranı",manage:"Yönet",courtModeDesc:"Oyuncular için büyük +Puan butonları, oyun/set skoru, servis ve zaman göstergesi.",refModeDesc:"Telefondan puan, geri alma, servis düzeltme, duraklatma ve maç kurulumu.",tvModeDesc:"Kontrol butonu olmadan büyük canlı skor ekranı.",adminModeDesc:"Tüm kortların canlı durumunu tek ekrandan izle.",ready:"Hazır",finished:"Bitti",paused:"Duraklatıldı",live:"Canlı",newCourt:"Yeni Kort",newCourtPrompt:"Yeni kort adı:",sets:"SETLER",set:"SET",matchFinished:"MAÇ BİTTİ",tiebreak:"TIE-BREAK",deuce:"DEUCE",advantage:"ADVANTAGE",goldenPoint:"GOLDEN POINT",server:"SERVİS",point:"PUAN",addPoint:"+ PUAN",game:"GAME",matchTime:"MAÇ SÜRESİ",courtLeft:"KALAN KORT",undo:"↶ Geri",swap:"⇄ Taraf",links:"Bağlantılar",matchSettings:"Maç Ayarı",refMode:"Hakem Modu",courtAdmin:"Kort Yönetimi",pause:"Ⅱ Duraklat",resume:"▶ Devam",fixServer:"Servisi Düzelt",matchStatus:"Maç Durumu",recentActions:"Son İşlemler",noActions:"Henüz işlem yok.",status:"Durum",winner:"Kazanan",start:"Başlangıç",setup:"Maç Kur / Düzenle",renameCourt:"Kort Adını Değiştir",history:"Maç Geçmişi",noHistory:"Henüz tamamlanmış maç yok.",singleSet:"Tek Set",setupTitle:"Kort & Maç Kurulumu",setupDesc:"Kort, takımlar, oyuncular, sponsorlar ve skor kurallarını tek yerden ayarla.",courtName:"Kort İsmi",teamA:"Takım A",teamB:"Takım B",playerA1:"A1 Oyuncu",playerA2:"A2 Oyuncu",playerB1:"B1 Oyuncu",playerB2:"B2 Oyuncu",matchFormat:"Maç Formatı",scoreRule:"Skor Kuralı",courtDuration:"Kort Süresi",firstServe:"İlk Servis",serveOrder:"Servis Sırası",sponsors:"Sponsor Logoları",sponsorHelp:"Opsiyonel. Sponsorsuz maçta ekran tam boy kalır. En fazla 6 sponsor; PNG, JPG, WEBP, SVG veya PDF. Her dosya en fazla 1.5 MB.",cancel:"Vazgeç",reset:"Yeni maç olarak sıfırla",saveStart:"Kaydet & Başlat",bestOf3:"Best of 3 Set",advDeuce:"Advantage / Deuce",shareTitle:"Cihaz Bağlantıları",shareDesc:"İnternet bağlantısı olan cihazlarda aşağıdaki adresleri aç.",refPhone:"Hakem Telefonu",scoreScreen:"TV / Skor Ekranı",copy:"Adresleri Kopyala",close:"Kapat",backScore:"Skor ekranına dön",won:"kazandı",connectionError:"Bağlantı hatası",serveOrderError:"Servis sırasında her oyuncu bir kez olmalı",resetConfirm:"Mevcut maç skoru sıfırlanacak. Devam?",copied:"Adresler kopyalandı",copyFail:"Kopyalama desteklenmedi",servePicker:"Servis sırası",serveNumber:"Servis atanacak sıra numarası (1-4):",courtPrompt:"Kort adı:",tooManySponsors:"En fazla 6 sponsor yükleyebilirsin.",fileTooLarge:"dosyası 1.5 MB sınırını aşıyor.",unsupportedFile:"desteklenmeyen dosya türü.",deleteCourt:"Kort Sil",deleteCourtConfirm:"Bu kort ve maç geçmişi tamamen silinecek. Devam?",courtDeleted:"Kort silindi."},en:{connected:"Live connected",connecting:"Connecting",disconnected:"Connection lost",clubPanel:"Club Panel",heroEye:"GLASS SCORE • LIVE COURT SYSTEM",heroTitle:"One court score, live on every screen.",heroText:"Court tablet, referee phone and spectator display share the same match in real time. GLASS SCORE brings scoring, serving, match time and court control into one flow.",courts:"Courts",courtHint:"Choose a court and open a mode.",addCourt:"+ Add Court",modes:"Modes",courtTablet:"Court Tablet",referee:"Referee",tv:"TV Display",manage:"Manage",courtModeDesc:"Large point controls for players with game/set score, server and time.",refModeDesc:"Control points, undo, server, pause and match setup from a phone.",tvModeDesc:"Large read-only live scoreboard for spectators.",adminModeDesc:"Monitor all courts and match history from one place.",ready:"Ready",finished:"Finished",paused:"Paused",live:"Live",newCourt:"New Court",newCourtPrompt:"New court name:",sets:"SETS",set:"SET",matchFinished:"MATCH FINISHED",tiebreak:"TIE-BREAK",deuce:"DEUCE",advantage:"ADVANTAGE",goldenPoint:"GOLDEN POINT",server:"SERVER",point:"POINT",addPoint:"+ POINT",game:"GAME",matchTime:"MATCH TIME",courtLeft:"COURT LEFT",undo:"↶ Undo",swap:"⇄ Swap",links:"Links",matchSettings:"Match Setup",refMode:"Referee Mode",courtAdmin:"Court Management",pause:"Ⅱ Pause",resume:"▶ Resume",fixServer:"Fix Server",matchStatus:"Match Status",recentActions:"Recent Actions",noActions:"No actions yet.",status:"Status",winner:"Winner",start:"Start",setup:"Setup / Edit Match",renameCourt:"Rename Court",history:"Match History",noHistory:"No completed matches yet.",singleSet:"Single Set",setupTitle:"Court & Match Setup",setupDesc:"Set the court, teams, players, sponsors and scoring rules in one place.",courtName:"Court Name",teamA:"Team A",teamB:"Team B",playerA1:"A1 Player",playerA2:"A2 Player",playerB1:"B1 Player",playerB2:"B2 Player",matchFormat:"Match Format",scoreRule:"Scoring Rule",courtDuration:"Court Duration",firstServe:"First Server",serveOrder:"Service Order",sponsors:"Sponsor Logos",sponsorHelp:"Optional. Without sponsors, the scoreboard stays full-size. Up to 6 sponsors; PNG, JPG, WEBP, SVG or PDF. Max 1.5 MB per file.",cancel:"Cancel",reset:"Reset as new match",saveStart:"Save & Start",bestOf3:"Best of 3 Sets",advDeuce:"Advantage / Deuce",shareTitle:"Device Links",shareDesc:"Open these links on any internet-connected device.",refPhone:"Referee Phone",scoreScreen:"TV / Score Display",copy:"Copy Links",close:"Close",backScore:"Back to scoreboard",won:"won",connectionError:"Connection error",serveOrderError:"Each player must appear once in the service order",resetConfirm:"The current match score will be reset. Continue?",copied:"Links copied",copyFail:"Copy not supported",servePicker:"Service order",serveNumber:"Service position to assign (1-4):",courtPrompt:"Court name:",tooManySponsors:"You can upload up to 6 sponsors.",fileTooLarge:"exceeds the 1.5 MB limit.",unsupportedFile:"is an unsupported file type.",deleteCourt:"Delete Court",deleteCourtConfirm:"This court and its match history will be permanently deleted. Continue?",courtDeleted:"Court deleted."}};
function tx(k){return I18N[lang][k]??I18N.tr[k]??k}function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function fmtClock(ms){ms=Math.max(0,ms||0);let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}function elapsedMs(s){if(!s?.startedAt)return 0;const end=s.endedAt||s.pausedAt||Date.now();return Math.max(0,end-s.startedAt-(s.pausedTotalMs||0))}function remainMs(s){return Math.max(0,(s.bookingMinutes||90)*60000-elapsedMs(s))}function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700)}
async function api(url,opts={}){const res=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});if(!res.ok)throw new Error(await res.text());return res.json()}function action(action,extra={}){return api(`/api/court/${courtId}/action`,{method:"POST",body:JSON.stringify({action,...extra})}).catch(()=>toast(tx("connectionError")))}function go(c,m){location.href=`/?court=${encodeURIComponent(c)}&mode=${encodeURIComponent(m)}&lang=${lang}`}function home(){location.href=`/?lang=${lang}`}function statusText(s){if(s.status==="waiting")return tx("ready");if(s.status==="finished")return tx("finished");return s.pausedAt?tx("paused"):tx("live")}function statusClass(s){return s.status==="live"?"live":s.status==="finished"?"finished":""}
function langSwitch(){return `<div class="langSwitch"><button class="${lang==="tr"?"active":""}" onclick="setLang('tr')">TR</button><button class="${lang==="en"?"active":""}" onclick="setLang('en')">EN</button></div>`}function setLang(v){lang=v;localStorage.setItem("glassscore-lang",v);document.documentElement.lang=v;applyStaticI18n();render()}
function header(extra="",homeBtn=true){return `<div class="top"><div class="brand"><div class="logo"><img src="/glass-score-logo.svg" alt="GLASS SCORE"></div></div><div class="actions"><span class="connection"><i class="dot ${connected?"on":""}"></i>${connected?tx("connected"):tx("connecting")}</span>${extra}${langSwitch()}<button class="icon" onclick="toggleFull()">⛶</button>${homeBtn?`<button class="icon" onclick="home()">⌂</button>`:""}</div></div>`}
function applyStaticI18n(){document.documentElement.lang=lang;const vals={setupTitle:"setupTitle",setupDesc:"setupDesc",courtNameLabel:"courtName",teamALabel:"teamA",teamBLabel:"teamB",a1Label:"playerA1",a2Label:"playerA2",b1Label:"playerB1",b2Label:"playerB2",formatLabel:"matchFormat",ruleLabel:"scoreRule",durationLabel:"courtDuration",firstServeLabel:"firstServe",serveOrderLabel:"serveOrder",sponsorLabel:"sponsors",sponsorHelp:"sponsorHelp",cancelSetupBtn:"cancel",resetMatchBtn:"reset",saveStartBtn:"saveStart",shareTitle:"shareTitle",shareDesc:"shareDesc",shareCourtLabel:"courtTablet",shareRefLabel:"refPhone",shareDisplayLabel:"scoreScreen",copyBtn:"copy",closeShareBtn:"close",winnerCloseBtn:"backScore"};for(const [id,key] of Object.entries(vals)){const el=document.getElementById(id);if(el)el.textContent=tx(key)}const bo=$("#bestOf"),go=$("#golden");if(bo){const val=bo.value||"3";bo.innerHTML=`<option value="3">${tx("bestOf3")}</option><option value="1">${tx("singleSet")}</option>`;bo.value=val}if(go){const val=go.value||"0";go.innerHTML=`<option value="0">${tx("advDeuce")}</option><option value="1">${tx("goldenPoint")}</option>`;go.value=val}}
async function renderHome(){allCourts=await api("/api/courts");app.className="app";app.innerHTML=`${header(`<button class="btn" onclick="renderAdminHome()">${tx("clubPanel")}</button>`,false)}<section class="homeHero"><div class="eyebrow">${tx("heroEye")}</div><h1>${tx("heroTitle")}</h1><p>${tx("heroText")}</p></section><div class="sectionHead"><div><h2>${tx("courts")}</h2><p>${tx("courtHint")}</p></div><button class="btn" onclick="addCourt()">${tx("addCourt")}</button></div><section class="courtGrid">${allCourts.map(c=>courtCard(c)).join("")}</section><div class="sectionHead"><div><h2>${tx("modes")}</h2></div></div><section class="modeGrid"><div class="modeInfo"><b>${tx("courtTablet")}</b><small>${tx("courtModeDesc")}</small></div><div class="modeInfo"><b>${tx("refMode")}</b><small>${tx("refModeDesc")}</small></div><div class="modeInfo"><b>${tx("tv")}</b><small>${tx("tvModeDesc")}</small></div><div class="modeInfo"><b>${tx("clubPanel")}</b><small>${tx("adminModeDesc")}</small></div></section>`}
function courtCard(c){return `<article class="courtCard ${c.active?"":"inactive"}"><div class="courtTop"><div><h3>${esc(c.name)}</h3><small style="color:var(--muted)">#${esc(c.id)}</small></div><span class="badge ${statusClass(c)}">${statusText(c)}</span></div><div class="miniScore"><div class="team">${esc(c.teams[0].name)}</div><div class="score">${c.sets[0]} · ${c.games[0]} <span style="color:var(--muted)">/</span> ${c.games[1]} · ${c.sets[1]}</div><div class="team">${esc(c.teams[1].name)}</div></div><div class="cardButtons"><button class="primary" onclick="go('${c.id}','court')">${tx("courtTablet")}</button><button class="btn" onclick="go('${c.id}','referee')">${tx("referee")}</button><button class="btn" onclick="go('${c.id}','display')">${tx("tv")}</button><button class="btn" onclick="go('${c.id}','admin')">${tx("manage")}</button></div></article>`}
async function addCourt(){const name=prompt(tx("newCourtPrompt"),tx("newCourt"));if(!name)return;await api("/api/courts",{method:"POST",body:JSON.stringify({name})});renderHome()}async function renderAdminHome(){await renderHome();setTimeout(()=>document.querySelector(".sectionHead")?.scrollIntoView({behavior:"smooth"}),50)}
function connect(){if(!courtId)return;if(es)es.close();es=new EventSource(`/events?court=${encodeURIComponent(courtId)}`);es.onopen=()=>{connected=true;if(state)render()};es.onmessage=async e=>{connected=true;const incoming=JSON.parse(e.data);const oldSponsorVersion=state?.sponsorVersion??0;const newSponsorVersion=incoming.sponsorVersion??0;if(state&&oldSponsorVersion===newSponsorVersion){incoming.sponsors=state.sponsors||[]}else if(oldSponsorVersion!==newSponsorVersion){try{state=await api(`/api/court/${courtId}`);render();return}catch{}}state=incoming;render()};es.addEventListener("deleted",()=>{toast(tx("courtDeleted"));setTimeout(home,400)});es.onerror=()=>{connected=false;renderConnectionOnly()}}function renderConnectionOnly(){document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("on",connected));document.querySelectorAll(".connection").forEach(c=>{const n=c.lastChild;if(n)n.nodeValue=connected?tx("connected"):tx("disconnected")})}function sideTeams(){if(!state)return[0,1];return state.sidesSwapped?[1,0]:[0,1]}
function setHistoryHtml(){if(!state.setScores?.length)return `<div class="setRow"><span>—</span><small>${tx("sets")}</small><span>—</span></div>`;const order=sideTeams();return state.setScores.map((s,i)=>`<div class="setRow"><span>${s[order[0]]}</span><small>${i+1}. ${tx("set")}</small><span>${s[order[1]]}</span></div>`).join("")}function statusChip(){if(state.status==="finished")return tx("matchFinished");if(state.pausedAt)return tx("paused").toUpperCase();if(state.tiebreak)return `${tx("tiebreak")} • ${state.setScores.length+1}. ${tx("set")}`;const p=state.pointLabels;if(!state.goldenPoint&&p[0]==="40"&&p[1]==="40")return tx("deuce");if(!state.goldenPoint&&(p[0]==="ADV"||p[1]==="ADV"))return tx("advantage");if(state.goldenPoint&&state.points?.[0]>=3&&state.points?.[1]>=3)return tx("goldenPoint");return `${state.setScores.length+1}. ${tx("set")}`}function serverTeam(){return state.currentServer?.team??0}function playerNames(team){return state.teams[team].players.map((p,i)=>{const gid=team===0?i:i+2;return `<span class="${state.currentServer?.gid===gid?"serverPlayer":""}">${esc(p)}</span>`}).join("<span>•</span>")}
function teamCard(team,cls){const readonly=mode==="display";return `<article class="teamCard ${cls} ${serverTeam()===team?"server":""}" data-server-label="${tx("server")}"><div class="teamHead"><div class="teamName">${esc(state.teams[team].name)}</div><div class="players">${playerNames(team)}</div><div class="setLine"><span class="setPill">${tx("set")} <b>${state.sets[team]}</b></span></div></div><div class="bigScore"><div><div class="point ${String(state.pointLabels[team]).length>2?"small":""}">${state.pointLabels[team]}</div><div class="pointLabel">${state.tiebreak?tx("tiebreak"):tx("point")}</div></div></div>${readonly?"":`<button class="addPoint" onclick="action('point',{team:${team}})" ${state.status==="finished"||state.pausedAt?"disabled":""}>${tx("addPoint")}</button>`}</article>`}
function middleHtml(){const order=sideTeams();return `<aside class="middle"><div class="status">${statusChip()}</div><div class="games"><small>${tx("game")}</small><div class="gameNums">${state.games[order[0]]}<i>–</i>${state.games[order[1]]}</div></div><div class="serverBox"><small>${tx("server")}</small><b>${esc(state.currentServer?.name||"—")}</b></div><div class="setHistory">${setHistoryHtml()}</div><div class="clocks"><div class="clock"><b id="elapsed">${fmtClock(elapsedMs(state))}</b><small>${tx("matchTime")}</small></div><div class="clock"><b id="remain">${fmtClock(remainMs(state))}</b><small>${tx("courtLeft")}</small></div></div>${mode==="display"?"":`<div class="midBtns"><button class="btn" onclick="action('undo')">${tx("undo")}</button><button class="btn" onclick="action('swap')">${tx("swap")}</button></div>`}</aside>`}
function sponsorItemHtml(s){if(!s?.data)return"";if(s.type==="application/pdf")return `<div class="sponsorItem" title="${esc(s.name)}"><object data="${s.data}#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" aria-label="${esc(s.name)}"><div class="pdfFallback">PDF<br>${esc(s.name)}</div></object></div>`;return `<div class="sponsorItem" title="${esc(s.name)}"><img src="${s.data}" alt="${esc(s.name)}"></div>`}function sponsorStripHtml(){const arr=Array.isArray(state.sponsors)?state.sponsors:[];if(!arr.length)return"";return `<div class="sponsorStrip ${arr.length===1?"single":""}">${arr.map(sponsorItemHtml).join("")}</div>`}
function renderScore(){const order=sideTeams();app.className=mode==="display"?"app displayMode":"app";const extra=mode==="display"?"":`<button class="btn compactBtn" data-short="↗" onclick="openShare()"><span>${tx("links")}</span></button><button class="btn compactBtn" data-short="⚙" onclick="openSetup()"><span>${tx("matchSettings")}</span></button>`;const hasSponsors=Array.isArray(state.sponsors)&&state.sponsors.length>0;app.innerHTML=`${header(extra,true)}<div class="scoreShell ${hasSponsors?"":"noSponsors"}"><section class="scoreLayout">${teamCard(order[0],"teamA")}${middleHtml()}${teamCard(order[1],"teamB")}</section>${sponsorStripHtml()}</div>`;startTimers();maybeWinner()}
function startTimers(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const e=$("#elapsed"),r=$("#remain");if(e)e.textContent=fmtClock(elapsedMs(state));if(r){r.textContent=fmtClock(remainMs(state));r.classList.toggle("warning",remainMs(state)<=5*60000)}},1000)}function maybeWinner(){if(state.status==="finished"&&state.winner!==null&&lastFinishedMatchId!==state.matchId){lastFinishedMatchId=state.matchId;$("#winnerTitle").textContent=`${state.teams[state.winner].name} ${tx("won")}`;$("#winnerScore").textContent=state.setScores.map(s=>`${s[0]}-${s[1]}`).join(" • ");$("#winner").classList.add("open")}}
function renderReferee(){const s=serverTeam();app.className="app";app.innerHTML=`${header(`<button class="btn" onclick="openShare()">${tx("links")}</button><button class="btn" onclick="openSetup()">${tx("matchSettings")}</button>`)}<div class="refGrid">${[0,1].map(team=>`<div class="refTeam ${s===team?"server":""}"><h2>${esc(state.teams[team].name)}</h2><div class="refPlayers">${esc(state.teams[team].players.join(" • "))}</div><div class="refPoint">${state.pointLabels[team]}</div><button class="primary" onclick="action('point',{team:${team}})" ${state.status==="finished"||state.pausedAt?"disabled":""}>${tx("addPoint")}</button></div>`).join("")}</div><div class="refTools"><button class="btn" onclick="action('undo')">${tx("undo")}</button><button class="btn" onclick="action('swap')">${tx("swap")}</button><button class="btn" onclick="action('${state.pausedAt?"resume":"pause"}')">${state.pausedAt?tx("resume"):tx("pause")}</button><button class="btn" onclick="openServerPicker()">${tx("fixServer")}</button></div><section class="panel"><h3>${tx("matchStatus")}</h3><div class="miniScore"><div class="team">${esc(state.teams[0].name)}</div><div class="score">${state.sets[0]} ${tx("set")} · ${state.games[0]}-${state.games[1]} ${tx("game")} · ${state.sets[1]} ${tx("set")}</div><div class="team">${esc(state.teams[1].name)}</div></div><p>${statusChip()} · ${tx("server")}: <b style="color:var(--text)">${esc(state.currentServer.name)}</b> · <b id="elapsed">${fmtClock(elapsedMs(state))}</b> · <b id="remain">${fmtClock(remainMs(state))}</b></p></section><section class="panel"><h3>${tx("recentActions")}</h3><div class="log">${[...state.log].reverse().slice(0,20).map(l=>`<div class="logItem"><span>${esc(l.text)}</span><span>${new Date(l.at).toLocaleTimeString(lang==="tr"?"tr-TR":"en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></div>`).join("")||`<p>${tx("noActions")}</p>`}</div></section>`;startTimers();maybeWinner()}
function renderAdmin(){app.className="app";app.innerHTML=`${header(`<button class="btn" onclick="openShare()">${tx("links")}</button>`)}<section class="panel"><h3>${esc(state.name)}</h3><div class="adminRow"><div><strong>${tx("status")}</strong><small>${statusText(state)}</small></div><div><strong>${tx("set")}</strong><small>${state.sets[0]} - ${state.sets[1]}</small></div><div><strong>${tx("game")}</strong><small>${state.games[0]} - ${state.games[1]}</small></div><div><button class="primary" onclick="openSetup()">${tx("setup")}</button></div></div><div class="modalActions" style="justify-content:flex-start"><button class="btn" onclick="renameCourt()">${tx("renameCourt")}</button><button class="btn" onclick="go('${courtId}','court')">${tx("courtTablet")}</button><button class="btn" onclick="go('${courtId}','referee')">${tx("referee")}</button><button class="btn" onclick="go('${courtId}','display')">${tx("tv")}</button><button class="danger" onclick="deleteCourt()">${tx("deleteCourt")}</button></div></section><section class="panel"><h3>${tx("history")}</h3><div class="adminTable">${[...(state.history||[])].reverse().map(h=>`<div class="adminRow"><div><strong>${esc(h.teams[0].name)} vs ${esc(h.teams[1].name)}</strong><small>${h.setScores.map(s=>s.join("-")).join(" • ")}</small></div><div><strong>${h.winner===null?"—":esc(h.teams[h.winner].name)}</strong><small>${tx("winner")}</small></div><div><strong>${new Date(h.startedAt).toLocaleString(lang==="tr"?"tr-TR":"en-GB")}</strong><small>${tx("start")}</small></div><div><small>${h.goldenPoint?tx("goldenPoint"):tx("advantage")} · ${h.bestOf===1?tx("singleSet"):tx("bestOf3")}</small></div></div>`).join("")||`<p>${tx("noHistory")}</p>`}</div></section>`}
async function render(){applyStaticI18n();if(!courtId)return renderHome();if(!state)state=await api(`/api/court/${courtId}`);if(mode==="referee")renderReferee();else if(mode==="admin")renderAdmin();else renderScore()}
function openSetup(){const m=state;pendingSponsors=JSON.parse(JSON.stringify(m.sponsors||[]));$("#courtNameInput").value=state.name;$("#teamAName").value=m.teams[0].name;$("#teamBName").value=m.teams[1].name;$("#a1").value=m.teams[0].players[0];$("#a2").value=m.teams[0].players[1];$("#b1").value=m.teams[1].players[0];$("#b2").value=m.teams[1].players[1];applyStaticI18n();$("#bestOf").value=String(m.bestOf);$("#golden").value=m.goldenPoint?"1":"0";$("#booking").value=String(m.bookingMinutes);refreshServiceSelectors();renderSponsorPreview();$("#setupModal").classList.add("open")}
function playerOptions(){return[{gid:0,label:$("#a1").value||"A1"},{gid:2,label:$("#b1").value||"B1"},{gid:1,label:$("#a2").value||"A2"},{gid:3,label:$("#b2").value||"B2"}]}function refreshServiceSelectors(){const p=playerOptions();$("#firstServer").innerHTML=p.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join("");$("#firstServer").value=String(state.servicePos||0);$("#serviceOrderFields").innerHTML=[0,1,2,3].map((_,i)=>`<select id="so${i}">${p.map(x=>`<option value="${x.gid}" ${state.serviceOrder[i]===x.gid?"selected":""}>${esc(x.label)}</option>`).join("")}</select>`).join("")}
function renderSponsorPreview(){$("#sponsorPreview").innerHTML=pendingSponsors.map((s,i)=>`<div class="sponsorPreviewCard">${s.type==="application/pdf"?`<div class="pdfBadge">PDF<br>${esc(s.name)}</div>`:`<img src="${s.data}" alt="${esc(s.name)}">`}<button onclick="removeSponsor(${i})">×</button></div>`).join("")}function removeSponsor(i){pendingSponsors.splice(i,1);renderSponsorPreview()}async function handleSponsorFiles(files){const allowed=new Set(["image/png","image/jpeg","image/webp","image/svg+xml","application/pdf"]);for(const f of files){if(pendingSponsors.length>=6){toast(tx("tooManySponsors"));break}if(!allowed.has(f.type)){toast(`${f.name} ${tx("unsupportedFile")}`);continue}if(f.size>1.5*1024*1024){toast(`${f.name} ${tx("fileTooLarge")}`);continue}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});pendingSponsors.push({name:f.name,type:f.type,data})}renderSponsorPreview();$("#sponsorFiles").value=""}
document.addEventListener("change",e=>{if(e.target.id==="sponsorFiles")handleSponsorFiles([...e.target.files])});["a1","a2","b1","b2"].forEach(id=>document.addEventListener("input",e=>{if(e.target.id===id&&$("#setupModal").classList.contains("open"))refreshServiceSelectors()}));
function setupPayload(){const serviceOrder=[0,1,2,3].map(i=>Number($(`#so${i}`).value));if(new Set(serviceOrder).size!==4){toast(tx("serveOrderError"));throw new Error("service order")}return{teams:[{name:$("#teamAName").value||"TEAM A",players:[$("#a1").value||"A1",$("#a2").value||"A2"]},{name:$("#teamBName").value||"TEAM B",players:[$("#b1").value||"B1",$("#b2").value||"B2"]}],bestOf:Number($("#bestOf").value),goldenPoint:$("#golden").value==="1",bookingMinutes:Number($("#booking").value),serviceOrder,servicePos:Number($("#firstServer").value),sponsors:pendingSponsors}}
async function syncCourtName(){const name=$("#courtNameInput").value.trim();if(name&&name!==state.name)await action("renameCourt",{name})}async function saveAndStart(){try{const setup=setupPayload();await syncCourtName();await action("start",{setup});closeSetup()}catch{}}async function newMatchFromSetup(){if(!confirm(tx("resetConfirm")))return;try{const setup=setupPayload();await syncCourtName();await action("newMatch",{setup});await action("start",{setup});closeSetup()}catch{}}function closeSetup(){$("#setupModal").classList.remove("open")}
function openShare(){const base=location.origin,langQ=`&lang=${lang}`;$("#shareCourt").textContent=`${base}/?court=${courtId}&mode=court${langQ}`;$("#shareRef").textContent=`${base}/?court=${courtId}&mode=referee${langQ}`;$("#shareDisplay").textContent=`${base}/?court=${courtId}&mode=display${langQ}`;applyStaticI18n();$("#shareModal").classList.add("open")}function closeShare(){$("#shareModal").classList.remove("open")}async function copyCurrentShare(){const txt=`${tx("courtTablet")}: ${$("#shareCourt").textContent}\n${tx("referee")}: ${$("#shareRef").textContent}\n${tx("tv")}: ${$("#shareDisplay").textContent}`;try{await navigator.clipboard.writeText(txt);toast(tx("copied"))}catch{toast(tx("copyFail"))}}
function openServerPicker(){const items=state.serviceOrder.map((gid,pos)=>`${pos+1}) ${gid===0?state.teams[0].players[0]:gid===1?state.teams[0].players[1]:gid===2?state.teams[1].players[0]:state.teams[1].players[1]}`).join("\n");const n=prompt(`${tx("servePicker")}:\n${items}\n\n${tx("serveNumber")}`,String(state.servicePos+1));const pos=Number(n)-1;if(pos>=0&&pos<=3)action("setServer",{servicePos:pos})}async function renameCourt(){const name=prompt(tx("courtPrompt"),state.name);if(name)await action("renameCourt",{name})}async function deleteCourt(){if(!confirm(`${state.name}

${tx("deleteCourtConfirm")}`))return;try{await api(`/api/court/${courtId}`,{method:"DELETE"});toast(tx("courtDeleted"));setTimeout(home,350)}catch{toast(tx("connectionError"))}}async function toggleFull(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}}
document.addEventListener("keydown",e=>{if(["INPUT","SELECT"].includes(document.activeElement?.tagName))return;if(!courtId||mode==="display"||mode==="admin")return;if(e.key.toLowerCase()==="a")action("point",{team:0});if(e.key.toLowerCase()==="l")action("point",{team:1});if(e.key.toLowerCase()==="z")action("undo")});
applyStaticI18n();(async()=>{if(courtId){state=await api(`/api/court/${courtId}`);render();connect()}else renderHome()})();
</script>
</body>
</html>
